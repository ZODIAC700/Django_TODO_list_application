{% extends 'base/main.html' %}

{% block content %}

<div class="header-bar">
    <h2>My Dashboard</h2>

    <a href="{% url 'tasks' %}">My Tasks</a>
</div>

<div class="card-body">

    <h2>Hello {{ request.user|title }} 👋</h2>

    <div>
        <h3>Total Tasks</h3>
        <p>{{ total_tasks }}</p>
    </div>

    <div>
        <h3>Pending Tasks</h3>
        <p>{{ pending_tasks }}</p>
    </div>

    <div>
        <h3>Completed Tasks</h3>
        <p>{{ completed_tasks }}</p>
    </div>
    <div>
    <h3>Overdue Tasks</h3>
    <p>{{ overdue_count }}</p>
</div>

    <a class="button" href="{% url 'task-create' %}">
        + Add Task
    </a>

</div>

{% endblock content %}
